pipeline:
  name: PulseDesk Release
  identifier: PulseDesk_Release
  description: Revalidate main and publish a commit-tagged PulseDesk image.
  projectIdentifier: PulseDesk
  orgIdentifier: default
  properties:
    ci:
      codebase:
        connectorRef: PulseDesk_GitHub
        repoName: Hollywood/PulseDesk
        build: <+input>
  stages:
    - stage:
        name: Build Test and Publish
        identifier: Build_Test_and_Publish
        description: Revalidate merged code, build the application, and publish an immutable image.
        type: CI
        spec:
          cloneCodebase: true
          execution:
            steps:
              - step:
                  name: Certify and Build PulseDesk
                  identifier: Certify_and_Build_PulseDesk
                  type: Run
                  spec:
                    shell: Sh
                    command: |-
                      set -eu

                      npm install --global pnpm@11.25.0
                      pnpm install --frozen-lockfile
                      pnpm --dir claims-api gate
                      pnpm --dir web test
                      pnpm --dir scheduling-api test
                      pnpm -r typecheck
                      pnpm --dir claims-api build
                      pnpm --dir web build
              - step:
                  name: Build and Push PulseDesk
                  identifier: Build_and_Push_PulseDesk
                  type: BuildAndPushDockerRegistry
                  spec:
                    connectorRef: PulseDesk_GHCR
                    repo: hollywood/pulsedesk
                    tags:
                      - <+codebase.commitSha>
                      - latest
                    dockerfile: Dockerfile
                    context: .
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}

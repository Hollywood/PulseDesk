pipeline:
  id: PulseDesk_Build
  name: PulseDesk Build
  description: Validate every branch and pull request; publish main as a commit-tagged image.
  tags:
    ai_generated: ""
  inputs:
    # Publishing is opt-in so pull-request validation can never push an image.
    # The dedicated main-branch push trigger sets this input to true.
    publish_image:
      type: boolean
      default: false
  repo:
    connector: PulseDesk_GitHub
    name: Hollywood/PulseDesk
  clone:
    # PR validation creates a synthetic merge with the target branch. A depth-1
    # checkout has no common ancestor and Harness rejects it as unrelated history.
    depth: 0
  on:
    - push
    - pull_request:
        branches:
          - main
  stages:
    - id: Build_Test_and_Publish
      name: Build Test and Publish
      description: Certify the deterministic baseline, run supported tests, and publish only main.
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      steps:
        - id: Install_Dependencies
          name: Install Dependencies
          run:
            container:
              image: node:22-alpine
              connector: account.harnessImage
            shell: sh
            script: |-
              set -eu

              node --version
              npm install --global pnpm@11.25.0
              pnpm --version
              pnpm install --frozen-lockfile

        - id: Report_Supported_Tests
          name: Report Supported Tests
          run-test:
            container:
              image: node:22-alpine
              connector: account.harnessImage
            shell: sh
            script: |-
              set -eu

              npm install --global pnpm@11.25.0
              mkdir -p test-results
              pnpm --dir web exec vitest run \
                --reporter=junit \
                --outputFile=../test-results/web.xml
              pnpm --dir scheduling-api exec vitest run \
                --reporter=junit \
                --outputFile=../test-results/scheduling.xml
            report:
              type: junit
              path: test-results/*.xml
            intelligence:
              disabled: true

        - id: Certify_and_Build_PulseDesk
          name: Certify and Build PulseDesk
          run:
            container:
              image: node:22-alpine
              connector: account.harnessImage
            shell: sh
            script: |-
              set -eu

              apk add --no-cache git
              npm install --global pnpm@11.25.0
              pnpm --dir claims-api gate
              pnpm -r typecheck
              pnpm --dir claims-api build
              pnpm --dir web build

        - id: Build_and_Push_PulseDesk
          name: Build and Push PulseDesk
          if: ${{ branch == "main" && inputs.publish_image }}
          build:
            uses: buildAndPushToDocker
            with:
              connector: PulseDesk_GHCR
              repo: ghcr.io/hollywood/pulsedesk
              tags:
                - ${{ codebase.commitSha }}
                - latest
              dockerfile: Dockerfile
              context: .
